<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<nav class="navbar navbar-expand-md bg-body-tertiary">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      TechFix
    </a>

    <div class="navbar-nav">
      <a class="nav-link" href="index.html">Início</a>
      <a class="nav-link" href="orcamento.html">Orçamento</a>
    </div>
  </div>
</nav>
<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

      <div class="card shadow-sm">
        <div class="card-body p-4">

          <h1 class="h3 mb-3">Simulador de Orçamento</h1>

          <form id="formulario" novalidate>

            <div class="mb-3">
              <label for="nome" class="form-label">
                Nome do cliente
              </label>
              <input
                type="text"
                id="nome"
                class="form-control"
              >
            </div>

            <div class="mb-3">
              <label for="servico" class="form-label">
                Serviço
              </label>
              <select id="servico" class="form-select">
                <option value="120">Formatação — R$ 120</option>
                <option value="80">Limpeza — R$ 80</option>
                <option value="50">Instalação — R$ 50</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="quantidade" class="form-label">
                Quantidade
              </label>
              <input
                type="number"
                id="quantidade"
                class="form-control"
                min="1"
                step="1"
              >
            </div>

            <button type="submit" class="btn btn-primary w-100">
              Calcular orçamento
            </button>
          </form>

          <div id="resultado" class="alert d-none mt-3" role="alert"></div>

        </div>
      </div>

    </div>
  </div>
</main>
<body>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
